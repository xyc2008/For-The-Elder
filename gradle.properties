org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 固定使用 JDK 17 构建。
# 本机 PATH 中排在最前的 java.exe 是 Oracle 的 javapath 影子目录，直接依赖 PATH
# 会拿到不确定的 JVM；这里显式指定 JDK 17，保证命令行与 Android Studio 结果一致。
org.gradle.java.home=C:/Program Files/Java/jdk-17.0.18

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
